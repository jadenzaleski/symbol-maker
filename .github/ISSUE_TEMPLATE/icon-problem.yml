name: Icon problem
description: A template looks wrong, will not import, or has the wrong layers
title: "[icon] "
labels: ["icon"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an icon. The **Report a problem** button on the site fills in the icon set, the icon and the
        build details for you. Screenshots from the SF Symbols app help a lot.
  - type: input
    id: set
    attributes:
      label: Icon set
      placeholder: Lucide, Tabler Icons, Heroicons, Iconoir or Sidekickicons
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: Icon name
      placeholder: e.g. house
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - Looks wrong at one of the weights
        - Weights are uneven between Regular and Black
        - Shape is wrong or parts are missing
        - Will not import into SF Symbols
        - Xcode rejects it or it does not render
        - Layers should be split differently
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you expected and what you got. Attach screenshots if you can.
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Build details
      description: Filled in by the site's Report button. Leave as is.
      render: text
