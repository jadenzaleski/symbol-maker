name: Build and deploy site

# Builds every Lucide icon into an SF Symbols template and publishes the result to GitHub Pages.
# The build step is ./ci.sh, which you can run on your own Mac to get the same result.

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 5 * * 1'      # Mondays, to pick up new Lucide releases
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest      # SwiftDraw is a macOS tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SwiftDraw
        run: brew install swiftdraw
      - name: Restore converted icons
        # Keyed by the engine code, so a change to it starts fresh; each run saves what it converted. The cache file also
        # records the engine and SwiftDraw versions it was made with and is ignored if they differ.
        uses: actions/cache@v4
        with:
          path: build-cache.nosync
          key: convert-${{ runner.os }}-${{ hashFiles('symbolmaker/engine/*.py') }}-${{ github.run_id }}
          restore-keys: |
            convert-${{ runner.os }}-${{ hashFiles('symbolmaker/engine/*.py') }}-
      - name: Test and build
        run: ./ci.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist.nosync

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
