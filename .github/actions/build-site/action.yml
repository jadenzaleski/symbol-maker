name: Build the site
description: Run the checks and the tests, then convert every icon set into ./dist.nosync (conversions are cached between runs). Needs a macOS runner and a checkout.

runs:
  using: composite
  steps:
    - name: Install uv and Python
      # uv gets Python and the dev tools (ruff, ty) from pyproject.toml and uv.lock; ./ci.sh runs everything through it
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: '3.12'
        enable-cache: true
    - name: Install SwiftDraw
      shell: bash
      run: brew install swiftdraw
    - name: Restore converted icons
      # Keyed by the engine code, so a change to it starts fresh; each run saves what it converted. The cache file also
      # records the engine and SwiftDraw versions it was made with and is ignored if they differ.
      uses: actions/cache@v6
      with:
        path: build-cache.nosync
        key: convert-${{ runner.os }}-${{ hashFiles('symbolmaker/engine/*.py') }}-${{ github.run_id }}
        restore-keys: |
          convert-${{ runner.os }}-${{ hashFiles('symbolmaker/engine/*.py') }}-
    - name: Check, test and build
      shell: bash
      run: ./ci.sh
