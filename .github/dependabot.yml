# Keeps the GitHub Actions in .github/workflows and the shared build action up to date, and the dev tools (ruff, ty) in
# uv.lock: one pull request a week for each group. The program itself has no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-site
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # ruff and ty, from the dev group in pyproject.toml (the lock file is updated with them)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      dev-tools:
        patterns: ["*"]
