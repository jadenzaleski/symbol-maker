# Keeps the GitHub Actions in .github/workflows and the shared build action up to date (one pull request a week for all of them).
# The Python code has no third-party dependencies, so there is no pip entry; add one if that changes.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/build-site
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
